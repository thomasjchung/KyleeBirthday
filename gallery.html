<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kylee's 3D Museum Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: default !important;
        }
        
        #canvas-container {
            cursor: default !important;
        }
        
        #canvas-container canvas {
            cursor: default !important;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 100;
            text-align: center;
            font-size: 14px;
        }
        
        #instructions.hidden {
            display: none;
        }
        
        #exit-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        #exit-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        #expanded-note {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        #expanded-note.active {
            display: flex;
        }
        
        #expanded-note img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        
        #close-note-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        #close-note-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="instructions">
        Click to look around | Use ↑/W to move forward | Look at paintings to see notes
    </div>
    <button id="exit-button" onclick="window.location.href='index.html'">Exit Museum</button>
    
    <div id="expanded-note">
        <button id="close-note-button">×</button>
        <img id="expanded-note-image" src="" alt="Expanded Note">
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="gallery3d.js?v=51"></script>
</body>
</html>
