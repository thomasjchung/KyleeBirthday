<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Kylee - Museum Entrance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="entrance-page">
    <div class="museum-entrance">
        <div class="museum-building">
            <div class="museum-roof"></div>
            <div class="museum-body">
                <div class="museum-columns">
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                    <div class="column"></div>
                </div>
                <div class="museum-door">
                    <div class="door-frame">
                        <div class="door-left"></div>
                        <div class="door-right"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="entrance-content">
            <h1 class="birthday-title">Happy Birthday Kylee!</h1>
            <p class="subtitle">Hope you enjoy your gallery!</p>
            <p class="subtitle-small">Love you so much -- Thomas</p>
            <button class="enter-button" onclick="enterMuseum()">
                <span>Enter Museum</span>
                <div class="button-shine"></div>
            </button>
        </div>
        
        <div class="ground"></div>
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
